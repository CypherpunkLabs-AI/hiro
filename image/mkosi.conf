[Config]
Dependencies=initrd
MinimumVersion=25.3

[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
Mirror=https://snapshot.ubuntu.com/ubuntu/20261009T000000Z
Repositories=universe restricted

[Output]
ImageId=hiro
Output=hiro
OutputDirectory=../dist/image
Format=disk
Seed=2b607bd7-2a31-4d11-9e31-964353ec28f2
ManifestFormat=json

[Content]
SourceDateEpoch=0
Bootable=yes
Bootloader=uki
Initrds=%O/initrd.cpio.zst
KernelCommandLine=console=ttyS0 ro panic=10 systemd.show_status=yes
KernelModulesInitrdInclude=nvme
                          nvme-core
                          gve
                          virtio_pci
                          virtio_blk
                          virtio_net
                          dm-verity
                          dm-mod
                          squashfs
Packages=systemd
         systemd-boot-efi
         systemd-resolved
         systemd-timesyncd
         udev
         ca-certificates
         ubuntu-keyring
         cryptsetup
         kmod
         python3
         docker.io
         docker-compose-v2
         iptables
         iproute2
         linux-gcp
         linux-modules-extra-gcp
Autologin=no
Ssh=no
Locale=C.UTF-8
CleanPackageMetadata=yes
RemoveFiles=/var/log/*
            /var/cache/*
            /root/.cache
            /etc/ssh/ssh_host_*

[Build]
WithNetwork=yes
Environment=SOURCE_DATE_EPOCH=0
SandboxTrees=mkosi.pkgmngr

[Validation]
SecureBoot=no
