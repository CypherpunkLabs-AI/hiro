# Assembled by scripts/render-compose. The measured guest launcher owns the two mounts.
services:
  hiro-proxy:
    x-hiro-image: hiro-proxy
    image: ${HIRO_PROXY_IMAGE:?render with scripts/render-compose}
    user: "65532:65532"
    ports: ["8080:8080"]
    environment:
      HIRO_BIND_ADDRESS: 0.0.0.0:8080
      HIRO_TDX_REPORT_DIR: /run/hiro/tdx-report
      HIRO_ATTESTATION_DIR: /run/hiro/attestation
      DATABASE_URL: ${DATABASE_URL:?required}
      CACHE_NAMESPACE_KEY: ${CACHE_NAMESPACE_KEY:?required}
      PHALA_API_KEY: ${PHALA_API_KEY:?required}
      CLOUDFLARE_QUEUES_API_TOKEN: ${CLOUDFLARE_QUEUES_API_TOKEN:?required}
      USAGE_HMAC_SECRET: ${USAGE_HMAC_SECRET:?required}
      RUST_LOG: hiro_proxy=info
    volumes:
      - type: bind
        source: /run/hiro/tdx-report
        target: /run/hiro/tdx-report
        bind:
          create_host_path: false
      - type: bind
        source: /run/hiro/attestation
        target: /run/hiro/attestation
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: {soft: 0, hard: 0}
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
