name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
  attestations: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate repository configuration
        run: |
          scripts/validate
          python3 -m unittest discover -s tests -v
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      # Operator-authorized test fallback until removed; real runtime secrets take precedence.
      use_example_env: true
      os_image: ${{ vars.PHALA_OS_IMAGE }}
      instance_type: ${{ vars.PHALA_INSTANCE_TYPE }}
      region: ${{ vars.PHALA_REGION }}
      cli_version: ${{ vars.PHALA_CLI_VERSION || '1.1.22' }}
      cvm_id: ${{ vars.PHALA_CVM_ID }}
    secrets: inherit
