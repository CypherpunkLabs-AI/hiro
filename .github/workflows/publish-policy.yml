name: Publish and renew trust policy
on:
  push:
    branches: [main]
    paths:
      - 'trust/policy.json'
      - 'trust/platforms.json'
      - 'trust/kms.json'
      - '.github/workflows/publish-policy.yml'
  workflow_dispatch:
    inputs:
      approve_release:
        description: Optional signed release SHA256 to approve
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: read
jobs:
  policy:
    uses: CypherpunkLabs-AI/hiro/.github/workflows/policy.yml@faa4a7f1f91ea91c3e6cf4dbc530f33779db4b59
    with:
      signer_commit: faa4a7f1f91ea91c3e6cf4dbc530f33779db4b59
      approve_release: ${{ inputs.approve_release || '' }}
