name: Build, sign and publish GCP boot image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proxy_run:
        description: Successful proxy main publishing run (empty uses latest)
        type: string
permissions:
  contents: write
  packages: read
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cypherpunklabs' }}
      GCP_IMAGE_BUCKET: ${{ vars.GCP_IMAGE_BUCKET || 'cypherpunklabs-hiro-images' }}
      GCP_IMAGE_PUBLISHER: ${{ vars.GCP_IMAGE_PUBLISHER || 'hiro-image-publisher@cypherpunklabs.iam.gserviceaccount.com' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/1069855069526/locations/global/workloadIdentityPools/hiro-image-publisher/providers/github-main' }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Authenticate Google image publisher before building
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_IMAGE_PUBLISHER }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Check Google identity federation
        run: gcloud auth print-access-token > /dev/null
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Install release tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ubuntu-keyring
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Import and verify the proxy build
        env:
          PROXY_RUN: ${{ inputs.proxy_run }}
        run: |
          if [[ -n "$PROXY_RUN" ]]; then
            scripts/import-proxy-image --run "$PROXY_RUN"
          else
            scripts/import-proxy-image
          fi
          scripts/verify-images
          scripts/prepare-release --source-commit "$GITHUB_SHA" --tag "v0.1.0-sha.$GITHUB_SHA"
      - name: Stage container and build the complete OS image
        run: |
          nix develop --command python3 scripts/stage-image
          nix develop --command bash -c 'sudo env PATH="$PATH" mkosi -C image build'
          sudo chown -R "$(id -u):$(id -g)" dist/image
      - name: Verify disk integrity and boot the embedded proxy
        run: |
          nix develop --command python3 scripts/package-image
          nix develop --command python3 scripts/check-image-boot
          cp dist/boot-check.json dist/publish/
      - name: Sign the workload and boot-image manifests
        id: signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/publish/release.json
            dist/publish/image-release.json
      - name: Verify signatures and publish the GitHub release
        env:
          BUNDLE: ${{ steps.signature.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/publish/release.sigstore.json
          for manifest in release.json image-release.json; do
            gh attestation verify "dist/publish/$manifest" --bundle dist/publish/release.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-release.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          done
          gh release create "image-$GITHUB_SHA" dist/publish/* --target "$GITHUB_SHA" \
            --title "Hiro boot image $GITHUB_SHA" --prerelease \
            --notes 'Complete immutable OS and embedded proxy. Public dummy application credentials. See image-release.json and boot-check.json.'
      - name: Require GCP image publication configuration
        run: |
          for name in GCP_PROJECT_ID GCP_IMAGE_BUCKET GCP_IMAGE_PUBLISHER GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing. Run scripts/setup-gcp-publisher with authorized Google and GitHub accounts."
              exit 1
            fi
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_IMAGE_PUBLISHER }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Upload and register the GCP image
        run: |
          scripts/publish-gcp-image
          gh release upload "image-$GITHUB_SHA" dist/publish/gcp-image.json
      - name: Retain image build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/boot.log
            dist/boot-check.json
            dist/publish/*.json
            dist/image/*.manifest
          if-no-files-found: ignore
