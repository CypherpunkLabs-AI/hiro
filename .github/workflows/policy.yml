name: Sign and publish trust policy
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing positive policy sequence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hiro-evidence-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install configuration tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare policy from reviewed configuration
        env:
          POLICY_SEQUENCE: ${{ inputs.sequence }}
        run: scripts/prepare-policy --sequence "$POLICY_SEQUENCE"
      - name: Sign policy
        id: signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/policy.json
      - name: Verify and publish policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_BUNDLE: ${{ steps.signature.outputs.bundle-path }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: python3 scripts/publish-policy.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hiro-policy-${{ github.run_id }}
          path: dist/signed-policy.json
          if-no-files-found: error
          retention-days: 7
